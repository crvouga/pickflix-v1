# Owned by Pickflix; the shared workflow only builds and deploys the image.
name: Publish image

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write
  id-token: write
  pull-requests: read

jobs:
  validate:
    uses: ./.github/workflows/check.yml

  pickflix:
    needs: validate
    uses: crvouga/workspace/.github/workflows/ci.yml@main
    secrets:
      DEPLOY_DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
      CALLER_GITHUB_TOKEN: ${{ github.token }}
    with:
      service_id: pickflix
      dockerfile: ./Dockerfile
      context: .
      image_owner: crvouga
      image_prefix: chrisvouga
      infra_github_repo: crvouga/workspace

